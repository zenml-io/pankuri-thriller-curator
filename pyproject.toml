[project]
name = "pankuri-thriller-curator"
version = "0.1.0"
description = "LangGraph thriller-night curator recorded and evaluated with Kitaru"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kitaru[cli,worker]>=0.27.6",
    "kitaru-langgraph>=0.1.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
thriller-curator = "thriller_curator.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thriller_curator"]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
